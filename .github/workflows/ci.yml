name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      # Uses the pnpm version pinned in the root package.json `packageManager` field.
      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v4

      - name: Setup node env 🏗
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            api/pnpm-lock.yaml
            website/pnpm-lock.yaml

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Build API 🏗
        run: pnpm --filter api build

      - name: Type check API 🔎
        run: pnpm --filter api exec tsc --noEmit -p tsconfig.json

      - name: Test API 🧪
        run: pnpm --filter api test

      - name: Test API end to end 🧪
        run: pnpm --filter api test:e2e

      - name: Build website 🏗
        run: pnpm --filter cards build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      # The API lint runs without --fix so CI never rewrites files.
      - name: Lint API 👀
        run: pnpm --filter api exec eslint "{src,test}/**/*.ts"

      # The website has existing lint errors, so its lint reports without
      # failing the build until the Nuxt 4 rebuild replaces it.
      - name: Lint website 👀
        continue-on-error: true
        run: pnpm --filter cards lint
