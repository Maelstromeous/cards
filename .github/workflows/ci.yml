name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      # Uses the pnpm version pinned in the root package.json `packageManager` field.
      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v4

      - name: Setup node env 🏗
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            api/pnpm-lock.yaml
            website/pnpm-lock.yaml

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Build API 🏗
        run: pnpm --filter api build

      - name: Type check API 🔎
        run: pnpm --filter api exec tsc --noEmit -p tsconfig.json

      - name: Test API 🧪
        run: pnpm --filter api test

      - name: Test API end to end 🧪
        run: pnpm --filter api test:e2e

      - name: Build website 🏗
        run: pnpm --filter cards build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      # Both apps have existing lint errors, so lint reports without failing
      # the build until those are cleaned up. The API lint runs without --fix.
      - name: Lint API 👀
        continue-on-error: true
        run: pnpm --filter api exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Lint website 👀
        continue-on-error: true
        run: pnpm --filter cards lint
